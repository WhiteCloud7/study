server:
  port: 8081
spring:
  application:
    name: provider
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/cloud1?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      max-lifetime: 1770000
      maximum-pool-size: 4
  #mybatis
  mybatis:
    type-aliases-package: com.whitecloud.provider.Entity
    mapper-locations: classpath:mapper/*.xml
  jpa:
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: none
# Eureka
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/  # Eureka Server ???
    fetch-registry: true      # ??????????? true?
    register-with-eureka: true  # ??? Eureka